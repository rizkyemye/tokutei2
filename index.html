<body data-page="masuk">
<div class="bungkus" style="max-width:460px;padding-top:44px">
  <p class="label-kategori">特定技能2号</p>
  <h1 id="judul">Masuk</h1>
  <p class="kecil">Catatan belajar tokutei ginou 2号 — materi, syarat, dan latihan soal.</p>

  <div id="kabar" class="kabar"></div>

  <form id="form" class="peti">
    <div class="baris">
      <label for="nama">Nama pengguna</label>
      <input id="nama" type="text" autocomplete="username" placeholder="mis. rizky" required>
    </div>
    <div class="baris">
      <label for="sandi">Sandi (min. 8 karakter)</label>
      <input id="sandi" type="password" autocomplete="current-password" required>
    </div>
    <button id="tombol-utama" class="tombol penuh" type="submit">Masuk</button>
  </form>

  <p class="kecil"><span id="tanya">Belum punya akun?</span> <a href="#" id="ganti">Daftar</a></p>
</div>
