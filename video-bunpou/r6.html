<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:'IPAGothic','Noto Sans JP',sans-serif;
 background:radial-gradient(1200px 800px at 20% -10%,#1c2a4a 0%,#0d1526 55%),#0d1526;color:#f4f7ff;
 display:flex;flex-direction:column;justify-content:center;padding:110px 90px}
.badge{font-size:34px;letter-spacing:.14em;color:#7fe3b0;font-weight:700;margin-bottom:36px}
h1{font-size:132px;line-height:1.06;font-weight:700}
h2{font-size:70px;margin-bottom:42px;font-weight:700}
.sub{font-size:50px;color:#b9c6e0;margin-top:30px;line-height:1.35}
.sub b{color:#ffd166}
.kana{font-size:36px;color:#8fa2c4;margin-top:22px}
ul{list-style:none;display:flex;flex-direction:column;gap:26px}
li{font-size:44px;line-height:1.4;padding-left:50px;position:relative;color:#e7eefc}
li::before{content:"\25b8";position:absolute;left:0;color:#7fe3b0;font-size:36px}
li b{color:#ffd166}
.jp{font-size:72px;line-height:1.45;font-weight:700}
.arti{font-size:44px;color:#dbe6fb;margin-top:36px;line-height:1.4}
.arti b{color:#ffd166}
.rumus{font-size:52px;font-weight:700;background:#16223a;border:2px solid #2a3c62;border-radius:26px;
 padding:30px 36px;margin-bottom:22px;color:#9fe6c4}
.card{background:#14203a;border:3px solid #2a3c62;border-radius:28px;padding:30px 34px;margin-bottom:22px}
.card.ok{border-color:#7fe3b0;background:#122a2a}
.card .t{font-size:46px;font-weight:700;color:#9fe6c4;margin-bottom:10px}
.card .d{font-size:34px;color:#c7d3ea;line-height:1.35}
.closing{font-size:56px;color:#7fe3b0;font-weight:700;margin-top:56px}
</style></head><body><p class="badge">なぜ違う</p><h2>Kenapa yang lain salah</h2>
<ul>
<li><b>〜たとき</b> — kejadiannya <b>sudah</b> terjadi</li>
<li><b>〜たがる</b> — <b>keinginan orang lain</b></li>
<li><b>〜させる</b> — <b>menyuruh</b> orang lain</li>
<li><b>〜ようとしたとき</b> — baru mau, lalu <b>disela</b> ✓</li>
</ul></body></html>
