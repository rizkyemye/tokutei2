<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<style>
@page{margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;
  font-family:'IPAGothic','Noto Sans JP',sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1c2a4a 0%, #0d1526 55%), #0d1526;
  color:#f4f7ff;display:flex;flex-direction:column;justify-content:center;padding:110px 90px}
.badge{font-size:34px;letter-spacing:.14em;color:#7fe3b0;font-weight:700;margin-bottom:38px;text-transform:uppercase}
h1.big{font-size:150px;line-height:1.05;letter-spacing:-.01em;font-weight:700}
h2{font-size:74px;line-height:1.2;margin-bottom:46px;font-weight:700}
.sub{font-size:54px;color:#b9c6e0;margin-top:34px;line-height:1.35}
.sub b{color:#ffd166}
.kana{font-size:40px;color:#8fa2c4;margin-top:26px}
.lead{font-size:58px;line-height:1.35;margin-bottom:44px}
.lead b{color:#ffd166}
ul{list-style:none;display:flex;flex-direction:column;gap:30px}
li{font-size:46px;line-height:1.4;padding-left:52px;position:relative;color:#e7eefc}
li::before{content:"▸";position:absolute;left:0;color:#7fe3b0;font-size:40px}
li b{color:#ffd166}
.rumus{font-size:56px;font-weight:700;background:#16223a;border:2px solid #2a3c62;border-radius:26px;
  padding:34px 40px;margin-bottom:26px;color:#9fe6c4}
.note{font-size:34px;color:#8fa2c4;margin-top:20px}
.jp{font-size:76px;line-height:1.45;font-weight:700;letter-spacing:.01em}
.kana{font-size:34px;color:#8fa2c4;margin-top:28px;line-height:1.5}
.arti{font-size:46px;color:#dbe6fb;margin-top:40px;line-height:1.4}
.arti b{color:#ffd166}
.dua{display:flex;flex-direction:column;gap:34px}
.kotak{background:#14203a;border:3px solid #2a3c62;border-radius:30px;padding:38px 40px}
.kotak.beda{border-color:#7fe3b0;background:#122a2a}
.kotak .t{font-size:52px;font-weight:700;color:#9fe6c4;margin-bottom:16px}
.kotak .d{font-size:38px;color:#c7d3ea;margin-bottom:20px;line-height:1.4}
.kotak .d b{color:#ffd166}
.kotak .e{font-size:42px;color:#eef3ff}
ul.big-ul li{font-size:48px}
.closing{font-size:64px;color:#7fe3b0;font-weight:700;margin-top:70px}
</style></head><body><p class="badge">例文 ②</p>
  <h2>Contoh 2</h2>
  <p class="jp">会議は来週に<br>延びることになった。</p>
  <p class="kana">かいぎは らいしゅうに のびることになった。</p>
  <p class="arti">Rapat <b>jadi</b> mundur ke minggu depan.</p></body></html>
